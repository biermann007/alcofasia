<!doctype html>
<html lang="de" data-theme="light">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#ffffff">
    <meta name="robots" content="noindex, nofollow">
    <title>alcofasia.com/admin</title>
    <link rel="stylesheet" href="/site-controls.css">
    <link rel="stylesheet" href="/admin.css">
  </head>
  <body>
    <nav class="site-controls" aria-label="Sprache und Darstellung">
      <button class="site-control" type="button" data-language="de" aria-label="Deutsch" title="Deutsch" aria-pressed="true">
        <span class="language-flag" aria-hidden="true">🇩🇪</span><span class="visually-hidden">Deutsch</span>
      </button>
      <button class="site-control" type="button" data-language="en" aria-label="English" title="English" aria-pressed="false">
        <span class="language-flag" aria-hidden="true">🇬🇧</span><span class="visually-hidden">English</span>
      </button>
      <button class="site-control" type="button" data-theme-control aria-label="Hell-Dunkel-Modus wechseln" title="Hell-Dunkel-Modus wechseln" aria-pressed="false">
        <svg class="theme-icon" viewBox="0 0 24 24" aria-hidden="true">
          <path class="theme-bulb" d="M8.8 14.5a6 6 0 1 1 6.4 0c-.9.8-1.2 1.7-1.2 3.5h-4c0-1.8-.3-2.7-1.2-3.5Z" />
          <path d="M9 18h6M10 21h4" />
        </svg>
      </button>
    </nav>

    <header class="admin-header">
      <div>
        <p class="eyebrow" data-admin-text="eyebrow">Inhaltsverwaltung</p>
        <h1>alcofasia.com/admin</h1>
      </div>
      <a class="public-link" href="/" target="_blank" rel="noopener" data-admin-text="openPage">Öffentliche Seite öffnen ↗</a>
    </header>

    <main class="admin-shell" data-admin-app aria-busy="true">
      <aside class="country-panel">
        <label class="search-label" for="country-search" data-admin-text="search">Land suchen</label>
        <input id="country-search" class="country-search" type="search" autocomplete="off" data-country-search>
        <p class="country-count" data-country-count></p>
        <div class="country-navigation" data-country-navigation></div>
      </aside>

      <section class="editor-panel">
        <div class="loading-state" data-loading-state>Inhalte werden geladen …</div>
        <form class="country-form" data-country-form hidden></form>
      </section>
    </main>

    <div class="save-bar" data-save-bar hidden>
      <p class="save-status" data-save-status aria-live="polite"></p>
      <button class="button button-secondary" type="button" data-reset-country data-admin-text="discard">Änderungen verwerfen</button>
      <button class="button button-primary" type="button" data-save-country data-admin-text="save">Land speichern</button>
    </div>

    <footer><a href="https://franz-paul.com/impressum.html" target="_blank" rel="noopener noreferrer">©franz-paul</a></footer>
    <script src="/site-ui.js"></script>
    <script src="/admin.js" type="module"></script>
  </body>
</html>
