<!doctype html>
<html lang="de" data-theme="light">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#ffffff">
    <title>alcofasia.com/list</title>
    <link rel="stylesheet" href="/site-controls.css">
    <style>
      :root {
        color-scheme: light;
        font-family: Arial, Helvetica, sans-serif;
        --background: #ffffff;
        --foreground: #111111;
        --muted: #666666;
        --line: #d8d8d8;
      }

      :root[data-theme="dark"] {
        color-scheme: dark;
        --background: #000000;
        --foreground: #f5f5f5;
        --muted: #a0a0a0;
        --line: #383838;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        min-height: 100%;
        margin: 0;
      }

      body {
        display: flex;
        min-height: 100svh;
        flex-direction: column;
        background: var(--background);
        color: var(--foreground);
        transition: background-color 240ms ease, color 240ms ease;
      }

      main {
        width: min(100%, 96rem);
        margin: 0 auto;
        padding: clamp(2rem, 6vw, 5rem) clamp(1rem, 4vw, 3rem);
      }

      h1 {
        margin: 0 0 clamp(2rem, 5vw, 4rem);
        font-size: clamp(1.25rem, 3vw, 2.5rem);
        font-weight: 400;
        letter-spacing: -0.04em;
      }

      .table-wrap {
        overflow-x: auto;
        overscroll-behavior-inline: contain;
      }

      table {
        width: 100%;
        min-width: 108rem;
        border-collapse: collapse;
        text-align: left;
      }

      th,
      td {
        padding: 1rem 0.85rem;
        border-bottom: 1px solid var(--line);
        vertical-align: top;
      }

      th {
        color: var(--muted);
        font-size: 0.68rem;
        font-weight: 400;
        letter-spacing: 0.09em;
        text-transform: uppercase;
      }

      td {
        font-size: 0.84rem;
        line-height: 1.45;
      }

      tbody th {
        color: var(--foreground);
        font-size: 0.84rem;
        font-weight: 600;
        letter-spacing: 0;
        text-transform: none;
      }

      footer {
        margin-top: auto;
        padding: 1.5rem;
        text-align: center;
      }

      footer a {
        color: inherit;
        font-size: 0.8rem;
        text-decoration: none;
      }

      footer a:hover,
      footer a:focus-visible {
        text-decoration: underline;
        text-underline-offset: 0.2em;
      }

    </style>
  </head>
  <body>
    <nav class="site-controls" aria-label="Sprache und Darstellung" data-en-label="Language and appearance">
      <button class="site-control" type="button" data-language="de" aria-label="Deutsch" title="Deutsch" aria-pressed="true">
        <span class="language-flag" aria-hidden="true">🇩🇪</span><span class="visually-hidden">Deutsch</span>
      </button>
      <button class="site-control" type="button" data-language="en" aria-label="English" title="English" aria-pressed="false">
        <span class="language-flag" aria-hidden="true">🇬🇧</span><span class="visually-hidden">English</span>
      </button>
      <button class="site-control" type="button" data-theme-control aria-label="Hell-Dunkel-Modus wechseln" title="Hell-Dunkel-Modus wechseln" aria-pressed="false">
        <svg class="theme-icon" viewBox="0 0 24 24" aria-hidden="true">
          <path class="theme-bulb" d="M8.8 14.5a6 6 0 1 1 6.4 0c-.9.8-1.2 1.7-1.2 3.5h-4c0-1.8-.3-2.7-1.2-3.5Z" />
          <path d="M9 18h6M10 21h4" />
        </svg>
      </button>
    </nav>
    <main>
      <h1>alcofasia.com/list</h1>
      <div class="table-wrap">
        <table>
          <thead data-list-head></thead>
          <tbody data-list-rows></tbody>
        </table>
      </div>
    </main>
    <footer>
      <a href="https://franz-paul.com/impressum.html" target="_blank" rel="noopener noreferrer">©franz-paul</a>
    </footer>
    <script data-country-names></script>
    <script src="/site-ui.js"></script>
  </body>
</html>
