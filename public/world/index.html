<!doctype html>
<html lang="de" data-theme="light" data-tiefe="an">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#ffffff">
    <title>alcofworld.com</title>
    <link rel="stylesheet" href="/site-controls.css">
    <style>
      :root {
        color-scheme: light;
        font-family: Arial, Helvetica, sans-serif;
        --background: #ffffff;
        --foreground: #111111;
        --tooltip-background: #171717;
        --tooltip-foreground: #ffffff;
      }

      :root[data-theme="dark"] {
        color-scheme: dark;
        --background: #000000;
        --foreground: #f5f5f5;
        --tooltip-background: #f5f5f5;
        --tooltip-foreground: #111111;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        min-height: 100%;
        margin: 0;
      }

      body {
        display: grid;
        grid-template-columns: minmax(0, 1fr);
        min-height: 100svh;
        place-items: center;
        padding: clamp(1.5rem, 4vw, 3rem) clamp(1.5rem, 4vw, 3rem) 5rem;
        background: var(--background);
        color: var(--foreground);
        transition: background-color 240ms ease, color 240ms ease;
      }

      main {
        display: flex;
        width: min(100%, 64rem);
        min-width: 0;
        flex-direction: column;
        align-items: center;
        gap: clamp(1.25rem, 3vw, 2.75rem);
      }

      .map-wrap {
        width: min(100%, 52rem);
        min-width: 0;
      }

      .world-map,
      .world-map svg {
        display: block;
        width: 100%;
        max-height: 50svh;
        height: auto;
        object-fit: contain;
      }

      /* Dieselbe Tiefen-Optik wie die Asien-Karte der Startseite. */
      :root[data-tiefe="an"] .world-map svg {
        filter: drop-shadow(0 26px 34px rgb(17 17 17 / 16%));
      }

      :root[data-tiefe="an"][data-theme="dark"] .world-map svg {
        filter: drop-shadow(0 26px 34px rgb(0 0 0 / 55%));
      }

      .world-map path {
        transition: fill 160ms ease, stroke 160ms ease;
      }

      :root[data-theme="dark"] .world-map path {
        fill: #101010;
        stroke: #3d3d3d;
      }

      /* Nur Asien ist begehbar: es trägt das antike Gold des Buddha und
         leuchtet ruhig – dieselbe Sprache wie die gepflegten Länder auf der
         Asien-Karte. Die übrigen Kontinente bleiben stille Flächen. */
      .world-map a path {
        --asien-glow: 179 144 58;
        fill: #f8f3e6;
        stroke: #b3903a;
        stroke-width: 2.1;
        cursor: pointer;
        animation: asien-glow 3.8s ease-in-out infinite;
      }

      .world-map a:hover path,
      .world-map a:focus-visible path {
        fill: #efe4c8;
        animation: none;
        filter: drop-shadow(0 0 10px rgb(var(--asien-glow) / 65%));
      }

      .world-map a:focus-visible {
        outline: none;
      }

      :root[data-theme="dark"] .world-map a path {
        --asien-glow: 226 190 106;
        fill: #1c170c;
        stroke: #d2a94e;
      }

      :root[data-theme="dark"] .world-map a:hover path,
      :root[data-theme="dark"] .world-map a:focus-visible path {
        fill: #2b2312;
      }

      @keyframes asien-glow {
        0%,
        100% {
          filter: drop-shadow(0 0 0 rgb(var(--asien-glow) / 0%));
        }

        50% {
          filter: drop-shadow(0 0 9px rgb(var(--asien-glow) / 55%));
        }
      }

      .continent-tooltip {
        position: fixed;
        z-index: 10;
        max-width: 16rem;
        padding: 0.45rem 0.7rem;
        border-radius: 6px;
        background: var(--tooltip-background);
        color: var(--tooltip-foreground);
        font-size: 0.8rem;
        line-height: 1.35;
        pointer-events: none;
        opacity: 0;
        transform: translate(-50%, calc(-100% - 12px));
        transition: opacity 120ms ease;
      }

      .continent-tooltip[data-visible="true"] {
        opacity: 1;
      }

      h1 {
        margin: 0;
        font-size: clamp(1rem, 4vw, 2.5rem);
        font-weight: 400;
        letter-spacing: -0.04em;
        line-height: 1;
      }

      footer {
        position: fixed;
        right: 0;
        bottom: 0;
        left: 0;
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 1.5rem;
      }

      footer a {
        color: inherit;
        font-size: 0.8rem;
        text-decoration: none;
      }

      footer a:hover,
      footer a:focus-visible {
        text-decoration: underline;
        text-underline-offset: 0.2em;
      }

      @media (prefers-reduced-motion: reduce) {
        .world-map a path {
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <nav class="site-controls" aria-label="Sprache und Darstellung" data-en-label="Language and appearance">
      <button class="site-control" type="button" data-language="de" aria-label="Deutsch" title="Deutsch" aria-pressed="true">
        <span class="language-flag" aria-hidden="true">🇩🇪</span><span class="visually-hidden">Deutsch</span>
      </button>
      <button class="site-control" type="button" data-language="en" aria-label="English" title="English" aria-pressed="false">
        <span class="language-flag" aria-hidden="true">🇬🇧</span><span class="visually-hidden">English</span>
      </button>
      <button class="site-control" type="button" data-theme-control aria-label="Hell-Dunkel-Modus wechseln" title="Hell-Dunkel-Modus wechseln" aria-pressed="false">
        <svg class="theme-icon" viewBox="0 0 24 24" aria-hidden="true">
          <path class="theme-bulb" d="M8.8 14.5a6 6 0 1 1 6.4 0c-.9.8-1.2 1.7-1.2 3.5h-4c0-1.8-.3-2.7-1.2-3.5Z" />
          <path d="M9 18h6M10 21h4" />
        </svg>
      </button>
    </nav>
    <main>
      <div class="map-wrap">
        <div class="world-map" data-world-map>
          <img src="/world.svg" alt="">
        </div>
        <div class="continent-tooltip" data-continent-tooltip aria-live="polite"></div>
      </div>
      <h1>alcofworld.com</h1>
    </main>
    <footer>
      <a href="https://franz-paul.com/impressum.html" target="_blank" rel="noopener noreferrer">©franz-paul</a>
    </footer>
    <script src="/site-ui.js"></script>
    <script type="module">
      // Die Karte wird wie auf der Startseite nachgeladen und eingebettet,
      // damit CSS die Flächen erreichen kann. Asien wird in einen Link auf
      // alcofasia.com gehüllt – die übrigen Kontinente zeigen nur ihren Namen.
      const wrap = document.querySelector("[data-world-map]");
      const tooltip = document.querySelector("[data-continent-tooltip]");
      const ui = window.alcofasiaUi;

      const moveTooltip = (event) => {
        tooltip.style.left = `${event.clientX}px`;
        tooltip.style.top = `${event.clientY}px`;
      };

      try {
        const response = await fetch("/world.svg");
        if (!response.ok) throw new Error(`Map could not be loaded: ${response.status}`);
        wrap.innerHTML = await response.text();

        const svgNs = "http://www.w3.org/2000/svg";
        const asien = wrap.querySelector('path[data-continent="Asien"]');
        if (asien) {
          const link = document.createElementNS(svgNs, "a");
          link.setAttribute("href", "https://alcofasia.com");
          link.setAttribute("aria-label", "alcofasia");
          asien.replaceWith(link);
          link.append(asien);
        }

        for (const flaeche of wrap.querySelectorAll("path[data-continent]")) {
          flaeche.addEventListener("pointerenter", (event) => {
            const de = flaeche.dataset.continent;
            const en = flaeche.dataset.continentEn ?? de;
            tooltip.textContent = ui.getLanguage() === "en" ? en : de;
            moveTooltip(event);
            tooltip.dataset.visible = "true";
          });
          flaeche.addEventListener("pointermove", moveTooltip);
          flaeche.addEventListener("pointerleave", () => {
            tooltip.dataset.visible = "false";
          });
        }
      } catch (error) {
        // Ohne Karte bleibt die Seite leer, aber bedienbar – wie die
        // Startseite, wenn asia.svg nicht lädt.
        console.error(error);
      }
    </script>
  </body>
</html>
