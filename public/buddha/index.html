<!doctype html>
<html lang="de" data-theme="light">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#ffffff">
    <title>alcofasia.com</title>
    <link rel="stylesheet" href="/site-controls.css">
    <style>
      :root {
        color-scheme: light;
        font-family: Arial, Helvetica, sans-serif;
        --background: #ffffff;
        --foreground: #111111;
        --muted: #666666;
        --line: #d8d8d8;
      }

      :root[data-theme="dark"] {
        color-scheme: dark;
        --background: #000000;
        --foreground: #f5f5f5;
        --muted: #a0a0a0;
        --line: #383838;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        min-height: 100%;
        margin: 0;
      }

      body {
        display: flex;
        min-height: 100svh;
        flex-direction: column;
        background: var(--background);
        color: var(--foreground);
        transition: background-color 240ms ease, color 240ms ease;
      }

      main {
        width: min(100%, 80rem);
        margin: 0 auto;
        padding: clamp(2rem, 6vw, 5rem) clamp(1rem, 4vw, 3rem);
      }

      /* Die Wortmarke der Seite. Ein Klick führt zurück zur Karte. */
      h1 {
        margin: 0 0 clamp(2rem, 5vw, 4rem);
        font-size: clamp(1.25rem, 3vw, 2.5rem);
        font-weight: 400;
        letter-spacing: -0.04em;
      }

      h1 a {
        color: inherit;
        text-decoration: none;
      }

      /* Die beiden „o“ in der Wortmarke: der goldene Buddha der
         Startseite, auf Kleinbuchstaben-Größe gebracht und optisch auf
         die Zeile gesetzt. */
      .buddha-o {
        width: 0.68em;
        height: 0.68em;
        margin: 0 0.015em;
        fill: #b3903a;
        transform: translateY(0.045em);
        vertical-align: baseline;
      }

      :root[data-theme="dark"] .buddha-o {
        fill: #d2a94e;
      }

      .buddha-spalten {
        display: grid;
        grid-template-columns: minmax(0, 1.5fr) minmax(0, 1fr);
        gap: clamp(2rem, 6vw, 5rem);
        align-items: start;
      }

      @media (max-width: 48rem) {
        .buddha-spalten {
          grid-template-columns: minmax(0, 1fr);
        }
      }

      h2 {
        margin: 0 0 1.1rem;
        color: var(--muted);
        font-size: 0.72rem;
        font-weight: 400;
        letter-spacing: 0.09em;
        text-transform: uppercase;
      }

      /* Linke Spalte: alle bearbeiteten Länder, alphabetisch in zwei
         Spalten — erst die linke von oben nach unten, dann die rechte.
         So sind alle Länder ohne Scrollen sichtbar. */
      .laender-liste {
        margin: 0;
        padding: 0;
        columns: 2;
        column-gap: clamp(2rem, 4vw, 3.5rem);
        list-style: none;
      }

      .laender-liste li {
        break-inside: avoid;
      }

      @media (max-width: 34rem) {
        .laender-liste {
          columns: 1;
        }
      }

      .laender-liste li {
        border-bottom: 1px solid var(--line);
      }

      .laender-liste a {
        display: block;
        padding: 0.55rem 0;
        color: inherit;
        font-size: 0.92rem;
        line-height: 1.4;
        text-decoration: none;
      }

      .laender-liste a:hover,
      .laender-liste a:focus-visible {
        text-decoration: underline;
        text-underline-offset: 0.2em;
      }

      /* Rechte Spalte: die beiden Textbereiche aus dem Adminbereich. */
      .buddha-text {
        margin: 0 0 clamp(2rem, 5vw, 3.5rem);
      }

      .buddha-text:last-child {
        margin-bottom: 0;
      }

      .buddha-text p {
        margin: 0 0 1em;
        max-width: 65ch;
        font-size: 0.95rem;
        line-height: 1.6;
        white-space: pre-line; /* einfache Zeilenumbrüche aus dem Admin bleiben erhalten */
      }

      /* Zwischenüberschrift aus dem Admin (Zeile beginnt mit "## ") */
      .buddha-text h3 {
        margin: 1.6em 0 0.6em;
        font-size: 0.95rem;
        font-weight: 600;
        letter-spacing: 0;
      }

      .buddha-text h3:first-child {
        margin-top: 0;
      }

      .buddha-text p:last-child {
        margin-bottom: 0;
      }

      footer {
        margin-top: auto;
        padding: 1.5rem;
        text-align: center;
      }

      footer a {
        color: inherit;
        font-size: 0.8rem;
        text-decoration: none;
      }

      footer a:hover,
      footer a:focus-visible {
        text-decoration: underline;
        text-underline-offset: 0.2em;
      }
    </style>
  </head>

      </button>
