<!doctype html>
<html lang="de" data-theme="light">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#ffffff">
    <title>alcofasia.com</title>
    <link rel="stylesheet" href="/site-controls.css">
    <style>
      :root {
        color-scheme: light;
        font-family: Arial, Helvetica, sans-serif;
        --background: #ffffff;
        --foreground: #111111;
        --muted: #666666;
        --line: #d8d8d8;
      }

      :root[data-theme="dark"] {
        color-scheme: dark;
        --background: #000000;
        --foreground: #f5f5f5;
        --muted: #a0a0a0;
        --line: #383838;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        min-height: 100%;
        margin: 0;
      }

      body {
        display: flex;
        min-height: 100svh;
        flex-direction: column;
        background: var(--background);
        color: var(--foreground);
        transition: background-color 240ms ease, color 240ms ease;
      }

      main {
        width: min(100%, 72rem);
        margin: 0 auto;
        padding: clamp(2rem, 6vw, 5rem) clamp(1rem, 4vw, 3rem);
      }

      /* Die Wortmarke der Seite. Ein Klick führt zurück zur Karte. */
      h1 {
        margin: 0 0 clamp(2rem, 5vw, 4rem);
        font-size: clamp(1.25rem, 3vw, 2.5rem);
        font-weight: 400;
        letter-spacing: -0.04em;
      }

      h1 a {
        color: inherit;
        text-decoration: none;
      }

      .buddha-spalten {
        display: grid;
        grid-template-columns: minmax(0, 1fr) minmax(0, 1.35fr);
        gap: clamp(2rem, 6vw, 5rem);
        align-items: start;
      }

      @media (max-width: 48rem) {
        .buddha-spalten {
          grid-template-columns: minmax(0, 1fr);
        }
      }

      h2 {
        margin: 0 0 1.1rem;
        color: var(--muted);
        font-size: 0.72rem;
        font-weight: 400;
        letter-spacing: 0.09em;
        text-transform: uppercase;
      }

      /* Linke Spalte: alle bearbeiteten Länder, alphabetisch. */
      .laender-liste {
        margin: 0;
        padding: 0;
        list-style: none;
      }

      .laender-liste li {
        border-bottom: 1px solid var(--line);
      }

      .laender-liste a {
        display: block;
        padding: 0.55rem 0;
        color: inherit;
        font-size: 0.92rem;
        line-height: 1.4;
        text-decoration: none;
      }

      .laender-liste a:hover,
      .laender-liste a:focus-visible {
        text-decoration: underline;
        text-underline-offset: 0.2em;
      }

      /* Rechte Spalte: die beiden Textbereiche aus dem Adminbereich. */
      .buddha-text {
        margin: 0 0 clamp(2rem, 5vw, 3.5rem);
      }

      .buddha-text:last-child {
        margin-bottom: 0;
      }

      .buddha-text p {
        margin: 0 0 1em;
        max-width: 65ch;
        font-size: 0.95rem;
        line-height: 1.6;
      }

      .buddha-text p:last-child {
        margin-bottom: 0;
      }

      footer {
        margin-top: auto;
        padding: 1.5rem;
        text-align: center;
      }

      footer a {
        color: inherit;
        font-size: 0.8rem;
        text-decoration: none;
      }

      footer a:hover,
      footer a:focus-visible {
        text-decoration: underline;
        text-underline-offset: 0.2em;
      }
    </style>
  </head>
  <body>
    <nav class="site-controls" aria-label="Sprache und Darstellung" data-en-label="Language and appearance">
      <button class="site-control" type="button" data-language="de" aria-label="Deutsch" title="Deutsch" aria-pressed="true">
        <span class="language-flag" aria-hidden="true">🇩🇪</span><span class="visually-hidden">Deutsch</span>
      </button>
      <button class="site-control" type="button" data-language="en" aria-label="English" title="English" aria-pressed="false">
        <span class="language-flag" aria-hidden="true">🇬🇧</span><span class="visually-hidden">English</span>
      </button>
      <button class="site-control" type="button" data-theme-control aria-label="Hell-Dunkel-Modus wechseln" title="Hell-Dunkel-Modus wechseln" aria-pressed="false">
        <svg class="theme-icon" viewBox="0 0 24 24" aria-hidden="true">
          <path class="theme-bulb" d="M8.8 14.5a6 6 0 1 1 6.4 0c-.9.8-1.2 1.7-1.2 3.5h-4c0-1.8-.3-2.7-1.2-3.5Z" />
          <path d="M9 18h6M10 21h4" />
        </svg>
      </button>
    </nav>
    <main>
      <h1><a href="/">I love you</a></h1>
      <div class="buddha-spalten">
        <section aria-label="Bearbeitete Länder">
          <h2 data-en="Countries">Länder</h2>
          <!-- Der Worker setzt hier die veröffentlichten Länder ein:
               "Land — Getränk", alphabetisch, verlinkt auf die Detailansicht. -->
          <ul class="laender-liste" data-buddha-laender></ul>
        </section>
        <section aria-label="Empfehlungen">
          <div class="buddha-text">
            <h2>Top 3</h2>
            <!-- Inhalt kommt aus dem Adminbereich (/admin/buddha). -->
            <div data-buddha-top3></div>
          </div>
          <div class="buddha-text">
            <h2 data-en="Recommendation">Empfehlung</h2>
            <div data-buddha-empfehlung></div>
          </div>
        </section>
      </div>
    </main>
    <footer>
      <a href="https://franz-paul.com/impressum.html" target="_blank" rel="noopener noreferrer">©franz-paul</a>
    </footer>
    <script src="/site-ui.js"></script>
  </body>
</html>
