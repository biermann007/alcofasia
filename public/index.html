<!doctype html>
<html lang="de" data-theme="light" data-tiefe="an">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#ffffff">
    <title>alcofasia.com</title>
    <link rel="stylesheet" href="/site-controls.css">
    <style data-country-colors></style>
    <style>
      :root {
        color-scheme: light;
        font-family: Arial, Helvetica, sans-serif;
        --background: #ffffff;
        --foreground: #111111;
        --tooltip-background: #171717;
        --tooltip-foreground: #ffffff;
      }

      :root[data-theme="dark"] {
        color-scheme: dark;
        --background: #000000;
        --foreground: #f5f5f5;
        --tooltip-background: #f5f5f5;
        --tooltip-foreground: #111111;
      }

      * {
        box-sizing: border-box;
      }

      [hidden] {
        display: none !important;
      }

      html,
      body {
        min-height: 100%;
        margin: 0;
      }

      body {
        display: grid;
        /* Ohne die begrenzte Spalte würde sich das Grid an der Breite des
           Laufbands ausrichten und die ganze Seite waagerecht aufblähen. */
        grid-template-columns: minmax(0, 1fr);
        min-height: 100svh;
        place-items: center;
        padding: clamp(1.5rem, 4vw, 3rem) clamp(1.5rem, 4vw, 3rem) 5rem;
        background: var(--background);
        color: var(--foreground);
        transition: background-color 240ms ease, color 240ms ease;
      }

      main {
        display: flex;
        width: min(100%, 64rem);
        min-width: 0;
        flex-direction: column;
        align-items: center;
        gap: clamp(1.25rem, 3vw, 2.75rem);
      }

      .map-wrap {
        width: min(100%, 52rem);
        min-width: 0;
      }

      .asia-map,
      .asia-map img,
      .asia-map svg {
        display: block;
        width: 100%;
        max-height: 50svh;
        height: auto;
        object-fit: contain;
      }

      .asia-map svg {
        transition: filter 240ms ease;
      }

      .asia-map path.has-content {
        --country-glow: 86 137 168;
        --country-stroke: #628ba4;
        --country-fill: #f7fbfd;
        --country-hover-fill: #dcebf3;
        --country-dark-fill: #101820;
        --country-dark-hover-fill: #1a2b36;
        fill: var(--country-fill);
        stroke: var(--country-stroke);
        stroke-width: 2.1;
        animation: content-glow 3.8s ease-in-out infinite;
      }

      /* Länderfarben werden vom Worker aus der Datenbank eingesetzt */

      .asia-map path.has-content:hover,
      .asia-map path.has-content:focus-visible {
        fill: var(--country-hover-fill);
        stroke: var(--country-stroke);
        outline: none;
        animation: none;
        filter:
          drop-shadow(0 0 3px rgb(var(--country-glow) / 0.68))
          drop-shadow(0 0 10px rgb(var(--country-glow) / 0.42));
      }

      :root[data-theme="dark"] .asia-map svg {
        filter: none;
      }

      :root[data-theme="dark"] .asia-map path:not(.has-content) {
        filter: invert(1) grayscale(1);
      }

      :root[data-theme="dark"] .asia-map path.has-content {
        fill: var(--country-dark-fill);
        stroke: var(--country-stroke);
      }

      :root[data-theme="dark"] .asia-map path.has-content:hover,
      :root[data-theme="dark"] .asia-map path.has-content:focus-visible {
        fill: var(--country-dark-hover-fill);
        stroke: var(--country-stroke);
      }

      @keyframes content-glow {
        0%,
        100% {
          filter:
            drop-shadow(0 0 2px rgb(var(--country-glow) / 0.26))
            drop-shadow(0 0 5px rgb(var(--country-glow) / 0.16));
        }

        50% {
          filter:
            drop-shadow(0 0 3px rgb(var(--country-glow) / 0.52))
            drop-shadow(0 0 10px rgb(var(--country-glow) / 0.34));
        }
      }

      .country-list {
        display: flex;
        width: 100%;
        flex-wrap: wrap;
        justify-content: center;
        gap: 0.65rem 1rem;
        padding: clamp(1rem, 3vw, 2rem) 0;
        font-size: clamp(0.8rem, 1.5vw, 1rem);
        line-height: 1.4;
        text-align: center;
      }

      .country-word {
        padding: 0;
        border: 0;
        background: transparent;
        color: inherit;
        cursor: pointer;
        font: inherit;
        font-weight: 600;
        text-decoration: underline;
        text-underline-offset: 0.2em;
      }

      .country-detail {
        width: min(100%, 42rem);
        margin: 0 auto;
        padding: clamp(0.5rem, 2vw, 1rem) 0;
      }

      /* Der Artikel bekommt beim Öffnen programmatisch den Fokus (map.js),
         damit Vorlesewerkzeuge an der richtigen Stelle weiterlesen. Der blaue
         Standard-Fokusrahmen des Browsers ist dabei unerwünscht – per Tab
         erreichbar ist der Artikel ohnehin nicht (tabindex="-1"). */
      .country-detail:focus {
        outline: none;
      }

      .detail-back {
        padding: 0;
        border: 0;
        background: transparent;
        color: inherit;
        cursor: pointer;
        font: inherit;
        font-size: 0.8rem;
        text-decoration: underline;
        text-underline-offset: 0.2em;
      }

      .detail-back-bottom {
        display: block;
        margin-top: clamp(1.5rem, 4vw, 2.5rem);
      }

      .country-kicker {
        margin: clamp(1.5rem, 4vw, 3rem) 0 0.35rem;
        font-size: 0.75rem;
        letter-spacing: 0.16em;
        text-transform: uppercase;
      }

      .country-detail h2 {
        margin: 0;
        font-size: clamp(2.5rem, 8vw, 5rem);
        font-weight: 400;
        letter-spacing: -0.055em;
        line-height: 0.95;
      }

      .country-subtitle {
        margin: 0.75rem 0 clamp(1.5rem, 4vw, 2.5rem);
        font-size: clamp(1rem, 2.5vw, 1.35rem);
      }

      .country-copy {
        display: grid;
        gap: 1rem;
        font-size: clamp(0.9rem, 1.8vw, 1rem);
        line-height: 1.65;
      }

      .country-copy p {
        margin: 0;
      }

      .country-note {
        margin-top: 1.5rem;
      }

      .spirit-facts {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 1rem;
        margin: clamp(1.5rem, 4vw, 2.5rem) 0;
        padding: clamp(1rem, 3vw, 1.5rem) 0;
        border-block: 1px solid currentColor;
      }

      .spirit-facts div {
        display: grid;
        gap: 0.25rem;
      }

      .spirit-facts dt {
        font-size: 0.7rem;
        letter-spacing: 0.1em;
        opacity: 0.65;
        text-transform: uppercase;
      }

      .spirit-facts dd {
        margin: 0;
        font-size: 0.9rem;
      }

      .product-label {
        margin: 0 0 0.35rem;
        font-size: 0.7rem;
        letter-spacing: 0.1em;
        opacity: 0.65;
        text-transform: uppercase;
      }

      .product-grid {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 0.75rem;
      }

      .manufacturer-block + .manufacturer-block {
        margin-top: 2rem;
        padding-top: 2rem;
        border-top: 1px solid currentColor;
      }

      .manufacturer-title {
        margin: 0 0 1rem;
        font-size: clamp(1rem, 2.5vw, 1.25rem);
        font-weight: 400;
      }

      .product-card {
        display: flex;
        min-height: 13rem;
        flex-direction: column;
        align-items: flex-start;
        padding: 1rem;
        border: 1px solid currentColor;
      }

      .product-name {
        margin: 0;
        font-size: clamp(1.2rem, 3vw, 1.6rem);
        font-weight: 400;
      }

      .product-meta,
      .product-description,
      .sources {
        margin: 0.4rem 0 0;
        font-size: 0.8rem;
        line-height: 1.5;
      }

      .product-description {
        margin: 0.75rem 0 1rem;
        opacity: 0.75;
      }

      .availability {
        display: inline-block;
        margin-top: auto;
        padding: 0.6rem 0.85rem;
        border: 1px solid currentColor;
        font-size: 0.75rem;
      }

      .sources {
        margin-top: 1.5rem;
        opacity: 0.7;
      }

      .sources a {
        color: inherit;
        text-underline-offset: 0.2em;
      }

      /* Laufband über der Karte. Läuft endlos nach links; die Einträge sind
         zweimal hintereinander gesetzt, damit der Übergang nahtlos ist. */
      .ticker {
        overflow: hidden;
        width: 100%;
        max-width: 100%;
        min-width: 0;
        margin-bottom: 0.75rem;
        font-size: 0.8rem;
        line-height: 1.6;
        -webkit-mask-image: linear-gradient(to right, transparent, #000 8%, #000 92%, transparent);
        mask-image: linear-gradient(to right, transparent, #000 8%, #000 92%, transparent);
      }

      .ticker-spur {
        display: flex;
        width: max-content;
        animation: ticker-lauf var(--ticker-dauer, 90s) linear infinite;
      }

      .ticker:hover .ticker-spur,
      .ticker:focus-within .ticker-spur {
        animation-play-state: paused;
      }

      .ticker-gruppe {
        display: flex;
        flex-shrink: 0;
        align-items: center;
      }

      .ticker-eintrag {
        padding: 0 0.55rem;
        border: 0;
        background: transparent;
        color: inherit;
        font: inherit;
        white-space: nowrap;
      }

      /* Länder ohne hinterlegte Inhalte: nur Text, kein Verweis. */
      span.ticker-eintrag {
        opacity: 0.55;
      }

      button.ticker-eintrag {
        cursor: pointer;
        text-decoration: underline;
        text-underline-offset: 0.2em;
      }

      /* Länder mit Inhalten leuchten in ihrer eigenen Kartenfarbe. */
      button.ticker-eintrag.hat-inhalt {
        --ticker-glow: var(--eigen-glow, 86 137 168);
        text-shadow:
          0 0 4px rgb(var(--ticker-glow) / 0.55),
          0 0 12px rgb(var(--ticker-glow) / 0.3);
      }

      /* Länder mit Alkoholverbot. */
      button.ticker-eintrag.verboten {
        color: #b3261e;
        text-shadow: none;
      }

      :root[data-theme="dark"] button.ticker-eintrag.verboten {
        color: #ff6b5e;
      }

      button.ticker-eintrag:hover,
      button.ticker-eintrag:focus-visible {
        outline: none;
        text-decoration-thickness: 2px;
      }

      .ticker-trenner {
        flex-shrink: 0;
        opacity: 0.3;
        user-select: none;
      }

      @keyframes ticker-lauf {
        from { transform: translateX(0); }
        to { transform: translateX(-50%); }
      }

      .view-toggle {
        display: block;
        margin: 1rem auto 0;
        padding: 0.25rem;
        border: 0;
        background: transparent;
        color: inherit;
        cursor: pointer;
        font: inherit;
        font-size: 0.8rem;
        text-decoration: underline;
        text-underline-offset: 0.2em;
      }

      .view-toggle:disabled {
        cursor: default;
        opacity: 0.4;
      }

      /* Länderzähler hinter „… Länder anzeigen“:
         grün = Detailseite vorhanden, rot = noch offen.
         Rot entspricht der Verbots-Farbe des Laufbands. */
      .view-toggle .anzahl-bearbeitet {
        color: #1a7f37;
        font-weight: 600;
      }

      .view-toggle .anzahl-offen {
        color: #b3261e;
        font-weight: 600;
      }

      .view-toggle .anzahl-trenner {
        opacity: 0.35;
      }

      :root[data-theme="dark"] .view-toggle .anzahl-bearbeitet {
        color: #4cc38a;
      }

      :root[data-theme="dark"] .view-toggle .anzahl-offen {
        color: #ff6b5e;
      }

      .country-tooltip {
        position: fixed;
        z-index: 10;
        top: 0;
        left: 0;
        padding: 0.5rem 0.75rem;
        border-radius: 999px;
        background: var(--tooltip-background);
        box-shadow: 0 0.5rem 1.5rem rgb(0 0 0 / 18%);
        color: var(--tooltip-foreground);
        font-size: 0.8rem;
        letter-spacing: 0.02em;
        line-height: 1;
        opacity: 0;
        pointer-events: none;
        transform: translate(-50%, calc(-100% - 0.8rem));
        transition: opacity 120ms ease;
        white-space: nowrap;
      }

      .country-tooltip[data-visible="true"] {
        opacity: 1;
      }

      h1 {
        margin: 0;
        font-size: clamp(1rem, 4vw, 2.5rem);
        font-weight: 400;
        letter-spacing: -0.04em;
        line-height: 1;
      }

      /* Der Buddha unter der Wortmarke. Kein Text, keine Erklärung – er führt
         auf /buddha. Alle sieben Sekunden huscht ein schmaler Lichtreflex über
         die Form (kein Pulsieren): ein schräges Band wandert einmal quer
         durch, auf die Silhouette beschnitten. Seit 11.08. in Antikgold statt
         Schwarz/Weiß – wie eine vergoldete Statue; der Reflex ist in beiden
         Modi ein warmes Licht, wie Glanz auf Metall. */
      .buddha-link {
        --buddha-glow: 179 144 58;
        --buddha-glanz: rgb(255 248 225 / 90%);
        display: inline-block;
        margin-top: 1.6rem;
        color: #b3903a;
        line-height: 0;
      }

      :root[data-theme="dark"] .buddha-link {
        --buddha-glow: 226 190 106;
        --buddha-glanz: rgb(255 233 178 / 80%);
        color: #d2a94e;
      }

      .buddha-link svg {
        display: block;
      }

      .buddha-link:hover svg,
      .buddha-link:focus-visible svg {
        filter: drop-shadow(0 0 6px rgb(var(--buddha-glow) / 60%));
      }

      /* Die Sequenz: Erst rast das Licht einmal um den Enso-Ring (dem
         Pinselstrich entlang), unmittelbar danach huscht der Reflex über die
         Figur. Beides zusammen ~1,2 s, alle 7 s. Der negative Delay sorgt
         dafür, dass die erste Sequenz schon kurz nach dem Laden kommt. */
      .buddha-ring {
        stroke: var(--buddha-glanz);
        stroke-dasharray: 16 84;
        stroke-dashoffset: 16;
        opacity: 0;
        animation: buddha-kreis 7s linear infinite;
        animation-delay: -5s;
      }

      .buddha-glanz-band {
        fill: var(--buddha-glanz);
        animation: buddha-blitz 7s linear infinite;
        animation-delay: -5s;
      }

      @keyframes buddha-kreis {
        0%,
        84% {
          stroke-dashoffset: 16;
          opacity: 0;
        }

        85% {
          opacity: 1;
        }

        95% {
          stroke-dashoffset: -84;
          opacity: 1;
        }

        96%,
        100% {
          stroke-dashoffset: -84;
          opacity: 0;
        }
      }

      @keyframes buddha-blitz {
        0%,
        94% {
          transform: translateX(-20px);
        }

        100% {
          transform: translateX(44px);
        }
      }

      footer {
        position: fixed;
        right: 0;
        bottom: 0;
        left: 0;
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 1.5rem;
      }

      footer a {
        color: inherit;
        font-size: 0.8rem;
        text-decoration: none;
      }

      footer a:hover,
      footer a:focus-visible {
        text-decoration: underline;
        text-underline-offset: 0.2em;
      }

      @media (prefers-reduced-motion: reduce) {
        /* Das Laufband steht still und wird stattdessen umbrochen, damit alle
           Länder trotzdem erreichbar bleiben. */
        .ticker-spur {
          animation: none;
          width: 100%;
          flex-wrap: wrap;
          justify-content: center;
        }

        .ticker-gruppe:nth-child(2) {
          display: none;
        }

        .ticker-gruppe {
          flex-wrap: wrap;
          justify-content: center;
        }

        body,
        .asia-map svg {
          transition: none;
        }

        .buddha-glanz-band,
        .buddha-ring {
          animation: none;
          opacity: 0;
        }

        .asia-map path.has-content {
          animation: none;
          filter:
            drop-shadow(0 0 2px rgb(var(--country-glow) / 0.42))
            drop-shadow(0 0 7px rgb(var(--country-glow) / 0.26));
        }
      }

      @media (max-width: 34rem) {
        .spirit-facts,
        .product-grid {
          grid-template-columns: 1fr;
        }
      }

      /* Tiefe. Immer eingeschaltet (data-tiefe="an" am <html>-Element).
         Keine neuen Farbtöne: jeder Schatten und jede Fläche ist die
         vorhandene Vorder- bzw. Hintergrundfarbe mit Alpha. Nichts
         verschiebt sich — auch nicht beim Hover. Hell wirft Schatten
         nach unten; Dunkel hebt Flächen minimal an und setzt eine
         feine Lichtkante oben. */
      :root[data-tiefe="an"] body {
        background-image: radial-gradient(90rem 62rem at 50% 34%,
          rgb(17 17 17 / 0) 55%, rgb(17 17 17 / 0.045) 100%);
        background-attachment: fixed;
      }

      :root[data-tiefe="an"][data-theme="dark"] body {
        background-image: radial-gradient(64rem 42rem at 50% 36%,
          rgb(245 245 245 / 0.05), rgb(245 245 245 / 0) 62%);
        background-attachment: fixed;
      }

      /* Karte: löst sich vom Grund — Kontakt-, Kern- und Streuschatten. */
      :root[data-tiefe="an"] .asia-map svg {
        filter:
          drop-shadow(0 2px 3px rgb(17 17 17 / 0.07))
          drop-shadow(0 18px 34px rgb(17 17 17 / 0.13))
          drop-shadow(0 46px 84px rgb(17 17 17 / 0.08));
      }

      /* Im Dunkeln gibt es keinen Schatten auf Schwarz —
         stattdessen ein sehr leiser Lichthof hinter der Karte. */
      :root[data-tiefe="an"][data-theme="dark"] .asia-map svg {
        filter:
          drop-shadow(0 0 32px rgb(245 245 245 / 0.05))
          drop-shadow(0 0 88px rgb(245 245 245 / 0.04));
      }

      /* Bedienleiste: Konturlinie weicht zurück, Milchglas und
         Schatten übernehmen die Trennung. */
      :root[data-tiefe="an"] .site-controls {
        border-color: rgb(17 17 17 / 0.14);
        background: rgb(255 255 255 / 0.78);
        -webkit-backdrop-filter: blur(12px);
        backdrop-filter: blur(12px);
        box-shadow:
          0 1px 2px rgb(17 17 17 / 0.06),
          0 10px 28px rgb(17 17 17 / 0.13);
        transition: background-color 240ms ease, border-color 240ms ease, box-shadow 240ms ease;
      }

      :root[data-tiefe="an"][data-theme="dark"] .site-controls {
        border-color: rgb(245 245 245 / 0.16);
        background: rgb(245 245 245 / 0.06);
        box-shadow:
          inset 0 1px 0 rgb(245 245 245 / 0.09),
          0 14px 36px rgb(0 0 0 / 0.6);
      }

      /* Produktkarten: liegen auf der Seite statt in ihr.
         Beim Hover vertieft sich nur der Schatten. */
      :root[data-tiefe="an"] .product-card {
        border-color: rgb(17 17 17 / 0.12);
        background: var(--background);
        box-shadow:
          0 1px 2px rgb(17 17 17 / 0.05),
          0 12px 28px rgb(17 17 17 / 0.09);
        transition: box-shadow 240ms ease, background-color 240ms ease, border-color 240ms ease;
      }

      :root[data-tiefe="an"] .product-card:hover {
        box-shadow:
          0 2px 4px rgb(17 17 17 / 0.06),
          0 20px 44px rgb(17 17 17 / 0.13);
      }

      :root[data-tiefe="an"][data-theme="dark"] .product-card {
        border-color: rgb(245 245 245 / 0.12);
        background: rgb(245 245 245 / 0.045);
        box-shadow:
          inset 0 1px 0 rgb(245 245 245 / 0.07),
          0 18px 40px rgb(0 0 0 / 0.55);
      }

      :root[data-tiefe="an"][data-theme="dark"] .product-card:hover {
        background: rgb(245 245 245 / 0.06);
        box-shadow:
          inset 0 1px 0 rgb(245 245 245 / 0.1),
          0 24px 52px rgb(0 0 0 / 0.65);
      }

      :root[data-tiefe="an"] .availability {
        border-color: rgb(17 17 17 / 0.16);
        box-shadow: 0 1px 2px rgb(17 17 17 / 0.06), 0 5px 14px rgb(17 17 17 / 0.07);
      }

      :root[data-tiefe="an"][data-theme="dark"] .availability {
        border-color: rgb(245 245 245 / 0.15);
        background: rgb(245 245 245 / 0.05);
        box-shadow: inset 0 1px 0 rgb(245 245 245 / 0.08);
      }

      /* Strukturlinien treten zurück: gleiche Farbe, halbe Kraft. */
      :root[data-tiefe="an"] .spirit-facts {
        border-color: rgb(17 17 17 / 0.28);
      }

      :root[data-tiefe="an"][data-theme="dark"] .spirit-facts {
        border-color: rgb(245 245 245 / 0.28);
      }
    </style>
  </head>
  <body>
    <nav class="site-controls" aria-label="Sprache und Darstellung" data-en-label="Language and appearance">
      <button class="site-control" type="button" data-language="de" aria-label="Deutsch" title="Deutsch" aria-pressed="true">
        <span class="language-flag" aria-hidden="true">🇩🇪</span><span class="visually-hidden">Deutsch</span>
      </button>
      <button class="site-control" type="button" data-language="en" aria-label="English" title="English" aria-pressed="false">
        <span class="language-flag" aria-hidden="true">🇬🇧</span><span class="visually-hidden">English</span>
      </button>
      <button class="site-control" type="button" data-theme-control aria-label="Hell-Dunkel-Modus wechseln" title="Hell-Dunkel-Modus wechseln" aria-pressed="false">
        <svg class="theme-icon" viewBox="0 0 24 24" aria-hidden="true">
          <path class="theme-bulb" d="M8.8 14.5a6 6 0 1 1 6.4 0c-.9.8-1.2 1.7-1.2 3.5h-4c0-1.8-.3-2.7-1.2-3.5Z" />
          <path d="M9 18h6M10 21h4" />
        </svg>
      </button>
    </nav>
    <main>
      <div class="map-wrap">
        <div class="ticker" data-ticker hidden>
          <div class="ticker-spur" data-ticker-spur></div>
        </div>
        <div class="asia-map" id="asia-map" data-map>
          <img src="/asia.svg" alt="">
        </div>
        <div class="country-tooltip" data-country-tooltip aria-live="polite"></div>
        <div class="country-list" id="country-list" data-country-list hidden></div>
        <div data-country-details></div>
        <button class="view-toggle" type="button" data-en="Show countries" data-view-toggle aria-controls="asia-map country-list" aria-expanded="false" disabled>Länder anzeigen</button>
      </div>
      <h1>alcofasia.com</h1>
      <a class="buddha-link" href="/buddha" aria-label="Buddha">
        <svg width="34" height="34" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
