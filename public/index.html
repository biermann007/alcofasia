<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#ffffff">
    <title>alcofasia.com</title>
    <style>
      :root {
        color-scheme: light;
        font-family: Arial, Helvetica, sans-serif;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        min-height: 100%;
        margin: 0;
      }

      body {
        display: grid;
        min-height: 100svh;
        place-items: center;
        padding: clamp(1.5rem, 4vw, 3rem);
        background: #ffffff;
        color: #111111;
      }

      main {
        display: flex;
        width: min(100%, 64rem);
        flex-direction: column;
        align-items: center;
        gap: clamp(1.25rem, 3vw, 2.75rem);
      }

      .map-wrap {
        width: min(100%, 52rem);
      }

      .asia-map,
      .asia-map img,
      .asia-map svg {
        display: block;
        width: 100%;
        max-height: 50svh;
        height: auto;
        object-fit: contain;
      }

      .country-tooltip {
        position: fixed;
        z-index: 10;
        top: 0;
        left: 0;
        padding: 0.5rem 0.75rem;
        border-radius: 999px;
        background: #171717;
        box-shadow: 0 0.5rem 1.5rem rgb(0 0 0 / 18%);
        color: #ffffff;
        font-size: 0.8rem;
        letter-spacing: 0.02em;
        line-height: 1;
        opacity: 0;
        pointer-events: none;
        transform: translate(-50%, calc(-100% - 0.8rem));
        transition: opacity 120ms ease;
        white-space: nowrap;
      }

      .country-tooltip[data-visible="true"] {
        opacity: 1;
      }

      h1 {
        margin: 0;
        font-size: clamp(2rem, 8vw, 5rem);
        font-weight: 400;
        letter-spacing: -0.04em;
        line-height: 1;
      }
    </style>
  </head>
  <body>
    <main>
      <div class="map-wrap">
        <div class="asia-map" data-map>
          <img src="/asia.svg" alt="Interaktive Karte von Asien mit Ländergrenzen">
        </div>
        <div class="country-tooltip" data-country-tooltip aria-live="polite"></div>
      </div>
      <h1>alcofasia.com</h1>
    </main>
    <script src="/map.js" type="module"></script>
  </body>
</html>
