<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#ffffff">
    <title>alcofasia.com</title>
    <style>
      :root {
        color-scheme: light;
        font-family: Arial, Helvetica, sans-serif;
      }

      * {
        box-sizing: border-box;
      }

      [hidden] {
        display: none !important;
      }

      html,
      body {
        min-height: 100%;
        margin: 0;
      }

      body {
        display: grid;
        min-height: 100svh;
        place-items: center;
        padding: clamp(1.5rem, 4vw, 3rem) clamp(1.5rem, 4vw, 3rem) 5rem;
        background: #ffffff;
        color: #111111;
      }

      main {
        display: flex;
        width: min(100%, 64rem);
        flex-direction: column;
        align-items: center;
        gap: clamp(1.25rem, 3vw, 2.75rem);
      }

      .map-wrap {
        width: min(100%, 52rem);
      }

      .asia-map,
      .asia-map img,
      .asia-map svg {
        display: block;
        width: 100%;
        max-height: 50svh;
        height: auto;
        object-fit: contain;
      }

      .country-list {
        display: flex;
        width: 100%;
        flex-wrap: wrap;
        justify-content: center;
        gap: 0.65rem 1rem;
        padding: clamp(1rem, 3vw, 2rem) 0;
        font-size: clamp(0.8rem, 1.5vw, 1rem);
        line-height: 1.4;
        text-align: center;
      }

      .view-toggle {
        display: block;
        margin: 1rem auto 0;
        padding: 0.25rem;
        border: 0;
        background: transparent;
        color: inherit;
        cursor: pointer;
        font: inherit;
        font-size: 0.8rem;
        text-decoration: underline;
        text-underline-offset: 0.2em;
      }

      .view-toggle:disabled {
        cursor: default;
        opacity: 0.4;
      }

      .country-tooltip {
        position: fixed;
        z-index: 10;
        top: 0;
        left: 0;
        padding: 0.5rem 0.75rem;
        border-radius: 999px;
        background: #171717;
        box-shadow: 0 0.5rem 1.5rem rgb(0 0 0 / 18%);
        color: #ffffff;
        font-size: 0.8rem;
        letter-spacing: 0.02em;
        line-height: 1;
        opacity: 0;
        pointer-events: none;
        transform: translate(-50%, calc(-100% - 0.8rem));
        transition: opacity 120ms ease;
        white-space: nowrap;
      }

      .country-tooltip[data-visible="true"] {
        opacity: 1;
      }

      h1 {
        margin: 0;
        font-size: clamp(1rem, 4vw, 2.5rem);
        font-weight: 400;
        letter-spacing: -0.04em;
        line-height: 1;
      }

      footer {
        position: fixed;
        right: 0;
        bottom: 0;
        left: 0;
        padding: 1.5rem;
        text-align: center;
      }

      footer a {
        color: inherit;
        font-size: 0.8rem;
        text-decoration: none;
      }

      footer a:hover,
      footer a:focus-visible {
        text-decoration: underline;
        text-underline-offset: 0.2em;
      }
    </style>
  </head>
  <body>
    <main>
      <div class="map-wrap">
        <div class="asia-map" id="asia-map" data-map>
          <img src="/asia.svg" alt="">
        </div>
        <div class="country-tooltip" data-country-tooltip aria-live="polite"></div>
        <div class="country-list" id="country-list" data-country-list hidden></div>
        <button class="view-toggle" type="button" data-view-toggle aria-controls="asia-map country-list" aria-expanded="false" disabled>Länder anzeigen</button>
      </div>
      <h1>alcofasia.com</h1>
    </main>
    <footer>
      <a href="https://franz-paul.com/impressum.html" target="_blank" rel="noopener noreferrer">©franz-paul</a>
    </footer>
    <script src="/map.js" type="module"></script>
  </body>
</html>
